<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Vertical Spelling Jump</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    /* Окно игры */
    #game-window { position: relative; width: 1200px; height: 700px; background-size: cover; background-position: center; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 100vw; aspect-ratio: 12 / 7; }

    /* Мир, который будет двигаться ВНИЗ, чтобы камера "ехала" ВВЕРХ */
    #world { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; transition: transform 0.8s ease-in-out, opacity 0.8s; opacity: 0; }
    
    /* Стартовая земля */
    .ground-segment { position: absolute; bottom: 0; width: 100%; height: 60px; background: #6b4226; border-top: 15px solid #3cb371; z-index: 30; }

    /* Интерфейс */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.8s; }
    #score-board { position: absolute; top: 20px; right: 30px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; font-size: 28px; font-weight: bold; border-radius: 10px; border: 2px solid gold; text-shadow: 2px 2px 0 #000; }

    /* Персонаж - красивая дуга прыжка (left меняется линейно, bottom с ускорением/замедлением) */
    #player {
      position: absolute;
      width: 100px; height: 100px;
      bottom: 60px; /* На стартовой земле */
      left: 550px;  /* По центру */
      z-index: 40;
      object-fit: contain;
      transition: left 0.5s linear, bottom 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    /* Слова и кубики (генерируются динамически по высоте) */
    .word-display { position: absolute; width: 100%; text-align: center; font-size: 70px; color: white; font-weight: 900; text-shadow: 4px 4px 0 #000, 0 0 15px rgba(255,255,255,0.5); letter-spacing: 8px; z-index: 20;}
    
    .question-block {
      position: absolute;
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #ffc107, #d39e00);
      border: 4px solid #000;
      border-radius: 8px;
      display: flex; justify-content: center; align-items: center;
      font-size: 50px; color: white; font-weight: 900;
      cursor: pointer; pointer-events: auto;
      box-shadow: inset -5px -5px 0 rgba(0,0,0,0.3), inset 5px 5px 0 rgba(255,255,255,0.6), 5px 5px 20px rgba(0,0,0,0.8);
      text-shadow: 2px 2px 0 #000;
      transition: background 0.3s;
      z-index: 20;
    }
    .question-block::after { content: ''; position: absolute; inset: 4px; border: 2px dashed rgba(0,0,0,0.15); border-radius: 4px; pointer-events: none; }

    /* Экраны старта и победы */
    #start-screen { background: #000; z-index: 300; }
    
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
    .char-select { display: flex; gap: 30px; margin-top: 30px; }
    .char-option { width: 120px; height: 120px; object-fit: contain; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.1); border-radius: 15px; padding: 10px; border: 4px solid transparent; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
    .char-option:hover { transform: scale(1.1); border-color: #00bfff; background: rgba(0,191,255,0.2); }
    
    #victory-screen { background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
    #victory-screen h1 { font-size: 80px; color: gold; text-shadow: 0 0 30px rgba(255,215,0,0.8); margin: 0; }
    #victory-screen button { margin-top: 30px; padding: 15px 40px; font-size: 24px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 5px 0 #1e7e34; transition: 0.2s; }
    #victory-screen button:active { transform: translateY(5px); box-shadow: none; }
  </style>
</head>
<body>

  <div id="game-window">
    <div id="world">
      <div class="ground-segment"></div>
      <img id="player" src="" style="display: none;">
      <!-- Уровни будут генерироваться здесь -->
    </div>
    
    <div id="ui-layer">
      <div id="score-board">⭐ 0</div>
    </div>

    <!-- Черный стартовый экран -->
    <div id="start-screen" class="overlay">
      <h1 style="color: #fff; text-shadow: 2px 2px 0 #000, 0 0 20px #00bfff;">Выбери героя</h1>
      <div class="char-select" id="char-container"></div>
    </div>

    <div id="victory-screen" class="overlay" style="display: none;">
      <h1>СУПЕР!</h1>
      <p style="font-size: 30px; color: #ccc;">Ты добрался до вершины!</p>
      <button onclick="location.reload()">Сыграть еще раз</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');
    if (!rawData) {
      document.body.innerHTML = "<h1 style='color:white;'>Нет данных игры</h1>";
    } else {
      const data = JSON.parse(decodeURIComponent(atob(rawData)));
      initGame(data);
    }

    function initGame(data) {
      document.getElementById('game-window').style.backgroundImage = `url(${data.bg})`;
      
      const world = document.getElementById('world');
      const player = document.getElementById('player');
      const scoreBoard = document.getElementById('score-board');
      
      let currentIndex = 0;
      let score = 0;
      let isAnimating = false;

      // Расстояние по высоте между словами
      const LEVEL_HEIGHT = 300; 

      data.chars.forEach(imgUrl => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'char-option';
        img.onclick = () => {
          player.src = imgUrl;
          document.getElementById('start-screen').style.display = 'none';
          world.style.opacity = '1';
          document.getElementById('ui-layer').style.opacity = '1';
          player.style.display = 'block';
        };
        document.getElementById('char-container').appendChild(img);
      });

      // Генерация бесконечной башни уровней
      data.tasks.forEach((task, index) => {
        // Рассчитываем высоту этого уровня (чем больше index, тем выше)
        const targetY = 60 + (index + 1) * LEVEL_HEIGHT; 
        const blockY = targetY - 80; // Кубик чуть ниже позиции, куда приземляется герой
        const wordY = targetY + 60;  // Слово висит над кубиками

        const isCorrectLeft = Math.random() > 0.5;
        const leftLetter = isCorrectLeft ? task.correct : task.wrong;
        const rightLetter = isCorrectLeft ? task.wrong : task.correct;

        // Создаем слово
        const wordEl = document.createElement('div');
        wordEl.className = 'word-display';
        wordEl.id = `word-${index}`;
        wordEl.style.bottom = `${wordY}px`;
        wordEl.innerText = task.word;
        world.appendChild(wordEl);

        // Создаем Левый кубик
        const leftBlock = document.createElement('div');
        leftBlock.className = 'question-block left-block';
        leftBlock.style.bottom = `${blockY}px`;
        leftBlock.style.left = '350px';
        leftBlock.innerText = leftLetter;
        leftBlock.onclick = () => checkAnswer(index, leftLetter, task.correct, leftBlock, true, targetY);
        world.appendChild(leftBlock);

        // Создаем Правый кубик
        const rightBlock = document.createElement('div');
        rightBlock.className = 'question-block right-block';
        rightBlock.style.bottom = `${blockY}px`;
        rightBlock.style.left = '770px';
        rightBlock.innerText = rightLetter;
        rightBlock.onclick = () => checkAnswer(index, rightLetter, task.correct, rightBlock, false, targetY);
        world.appendChild(rightBlock);
      });

      // Логика прыжка и скроллинга
      window.checkAnswer = function(taskIndex, selectedLetter, correctLetter, blockElement, isLeft, targetY) {
        if (isAnimating || taskIndex !== currentIndex) return;
        isAnimating = true;

        // Координаты (340 и 760 - чтобы персонаж был четко по центру над кубиком)
        const targetLeft = isLeft ? 340 : 760; 

        // 1. Герой прыгает ВВЕРХ и ВБОК (по дуге)
        player.style.left = `${targetLeft}px`;
        player.style.bottom = `${targetY}px`;

        setTimeout(() => {
          if (selectedLetter === correctLetter) {
            // ПРАВИЛЬНО: Приземлились
            blockElement.style.background = '#28a745';
            const wordEl = document.getElementById(`word-${taskIndex}`);
            wordEl.innerText = wordEl.innerText.replace('_', correctLetter);
            score++;
            scoreBoard.innerText = `⭐ ${score}`;

            setTimeout(() => {
              currentIndex++;
              if (currentIndex >= data.tasks.length) {
                document.getElementById('victory-screen').style.display = 'flex';
              } else {
                // 2. КАМЕРА ДВИЖЕТСЯ ВВЕРХ (весь мир опускается вниз на один этаж)
                world.style.transform = `translateY(${currentIndex * LEVEL_HEIGHT}px)`;
                
                setTimeout(() => { isAnimating = false; }, 800); // Ждем пока камера доедет
              }
            }, 400); // Пауза после правильного ответа

          } else {
            // ОШИБКА
            blockElement.style.background = '#dc3545';
            
            setTimeout(() => {
              // 1. Герой срывается и летит в самый низ (за пределы экрана)
              player.style.bottom = `${targetY - 1000}px`; 
              
              // 2. Камера резко падает за ним (возвращается на 0)
              world.style.transform = `translateY(0px)`;
              
              setTimeout(() => {
                // Жесткий сброс всего прогресса
                currentIndex = 0;
                score = 0;
                scoreBoard.innerText = `⭐ 0`;
                
                // Мгновенно телепортируем героя обратно на землю по центру (отключаем анимацию на долю секунды)
                player.style.transition = 'none'; 
                player.style.left = '550px';
                player.style.bottom = '60px';
                
                // Возвращаем кубикам цвета и словам пропуски
                data.tasks.forEach((t, i) => {
                  document.getElementById(`word-${i}`).innerText = t.word;
                });
                document.querySelectorAll('.question-block').forEach(el => el.style.background = '');

                // Возвращаем анимации
                setTimeout(() => {
                  player.style.transition = 'left 0.5s linear, bottom 0.5s cubic-bezier(0.2, 0.8, 0.3, 1)';
                  isAnimating = false;
                }, 50);

              }, 800); // Время падения камеры
            }, 300); // Пауза на осознание ошибки
          }
        }, 500); // Время самого прыжка героя
      };
    }
  </script>
</body>
</html>
