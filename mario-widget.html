<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mario Spelling Game</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    /* Игровое окно 1200x700 */
    #game-window { position: relative; width: 1200px; height: 700px; background-size: cover; background-position: bottom; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 100vw; aspect-ratio: 12 / 7; }

    /* Лава (Слой: 35 - чтобы перекрывала падающего героя) */
    #lava { position: absolute; bottom: 0; width: 100%; height: 60px; background: linear-gradient(to bottom, #ff4500, #8b0000); border-top: 5px solid #ffaa00; z-index: 35; }
    
    /* Мир (Скрыт до старта) */
    #world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: left 1s ease-in-out, opacity 0.8s; opacity: 0; }
    
    /* Земля (Слой: 30 - Герой (20) падает ЗА нее, создавая эффект ямы) */
    .ground-segment { position: absolute; bottom: 60px; width: 1200px; height: 100px; background: #6b4226; border-top: 15px solid #3cb371; z-index: 30; }

    /* Интерфейс */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.8s; }
    #score-board { position: absolute; top: 20px; right: 30px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; font-size: 28px; font-weight: bold; border-radius: 10px; border: 2px solid gold; text-shadow: 2px 2px 0 #000; }

    /* Персонаж (Слой: 20) */
    #player {
      position: absolute;
      width: 100px; height: 100px;
      bottom: 160px; /* Уровень земли */
      left: 200px;
      z-index: 20;
      object-fit: contain;
      /* Плавные переходы для ходьбы и прыжков */
      transition: left 0.6s linear, bottom 0.3s cubic-bezier(0.2, 0.8, 0.3, 1), transform 0.5s ease;
    }
    #player.jump { bottom: 220px; /* Высота прыжка до блока */ }
    #player.fall { bottom: -150px; transform: rotate(180deg); transition: bottom 0.8s ease-in, transform 0.8s; }

    /* Элементы уровня */
    .level-station { position: absolute; width: 1200px; height: 100%; top: 0; }
    
    .word-display { position: absolute; top: 150px; width: 100%; text-align: center; font-size: 70px; color: white; font-weight: 900; text-shadow: 4px 4px 0 #000, 0 0 15px rgba(255,255,255,0.5); letter-spacing: 8px; }
    
    .blocks-container { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); display: flex; gap: 80px; }
    
    /* КРАСИВЫЙ БЛОК МАРИО */
    .question-block {
      position: relative;
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #ffc107, #d39e00);
      border: 4px solid #000;
      border-radius: 8px;
      display: flex; justify-content: center; align-items: center;
      font-size: 50px; color: white; font-weight: 900;
      cursor: pointer; pointer-events: auto;
      box-shadow: inset -5px -5px 0 rgba(0,0,0,0.3), inset 5px 5px 0 rgba(255,255,255,0.6), 5px 5px 15px rgba(0,0,0,0.6);
      text-shadow: 2px 2px 0 #000;
    }
    /* Заклепки по углам блока */
    .question-block::after { content: ''; position: absolute; inset: 4px; border: 2px dashed rgba(0,0,0,0.15); border-radius: 4px; pointer-events: none; }
    
    /* Анимация отскока блока при правильном ударе */
    @keyframes bump {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }
    .question-block.bump { animation: bump 0.2s ease-out; }

    /* Экраны старта и победы */
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
    .char-select { display: flex; gap: 30px; margin-top: 30px; }
    .char-option { width: 120px; height: 120px; object-fit: contain; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.6); border-radius: 15px; padding: 10px; border: 4px solid transparent; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .char-option:hover { transform: scale(1.1); border-color: #00bfff; }
    
    #victory-screen { background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
    #victory-screen h1 { font-size: 80px; color: gold; text-shadow: 0 0 30px rgba(255,215,0,0.8); margin: 0; }
    #victory-screen button { margin-top: 30px; padding: 15px 40px; font-size: 24px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 5px 0 #1e7e34; transition: 0.2s; }
    #victory-screen button:active { transform: translateY(5px); box-shadow: none; }
  </style>
</head>
<body>

  <div id="game-window">
    <div id="lava"></div>
    <div id="world"></div>
    
    <img id="player" src="" style="display: none;">
    
    <div id="ui-layer">
      <div id="score-board">⭐ 0</div>
    </div>

    <div id="start-screen" class="overlay">
      <h1 style="color: #fff; text-shadow: 2px 2px 0 #000, 0 0 20px #00bfff;">Кем ты будешь играть?</h1>
      <div class="char-select" id="char-container"></div>
    </div>

    <div id="victory-screen" class="overlay" style="display: none;">
      <h1>СУПЕР!</h1>
      <p style="font-size: 30px; color: #ccc;">Ты ответил на все слова!</p>
      <button onclick="location.reload()">Сыграть еще раз</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');
    if (!rawData) {
      document.body.innerHTML = "<h1 style='color:white;'>Нет данных игры</h1>";
    } else {
      const data = JSON.parse(decodeURIComponent(atob(rawData)));
      initGame(data);
    }

    function initGame(data) {
      document.getElementById('game-window').style.backgroundImage = `url(${data.bg})`;
      
      const world = document.getElementById('world');
      const player = document.getElementById('player');
      const scoreBoard = document.getElementById('score-board');
      
      let currentIndex = 0;
      let score = 0;
      let isAnimating = false;

      // Генерируем выбор персонажей
      data.chars.forEach(imgUrl => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'char-option';
        img.onclick = () => {
          player.src = imgUrl;
          document.getElementById('start-screen').style.display = 'none';
          
          // Показываем мир и UI
          world.style.opacity = '1';
          document.getElementById('ui-layer').style.opacity = '1';
          player.style.display = 'block';
        };
        document.getElementById('char-container').appendChild(img);
      });

      // Генерируем бесконечный уровень
      data.tasks.forEach((task, index) => {
        const ground = document.createElement('div');
        ground.className = 'ground-segment';
        ground.style.left = `${index * 1200}px`;
        world.appendChild(ground);

        const station = document.createElement('div');
        station.className = 'level-station';
        station.style.left = `${index * 1200}px`;
        
        const isCorrectLeft = Math.random() > 0.5;
        const leftLetter = isCorrectLeft ? task.correct : task.wrong;
        const rightLetter = isCorrectLeft ? task.wrong : task.correct;

        // Передаем true для левого блока и false для правого, чтобы знать куда идти
        station.innerHTML = `
          <div class="word-display" id="word-${index}">${task.word}</div>
          <div class="blocks-container">
            <div class="question-block" onclick="checkAnswer(${index}, '${leftLetter}', '${task.correct}', this, true)">${leftLetter}</div>
            <div class="question-block" onclick="checkAnswer(${index}, '${rightLetter}', '${task.correct}', this, false)">${rightLetter}</div>
          </div>
        `;
        world.appendChild(station);
      });

      // Логика проверки ответа
      window.checkAnswer = function(taskIndex, selectedLetter, correctLetter, blockElement, isLeft) {
        if (isAnimating || taskIndex !== currentIndex) return;
        isAnimating = true;

        // 1. Идем под нужный кубик (рассчитанные координаты X для левого и правого)
        const targetLeft = isLeft ? 470 : 630;
        player.style.left = `${targetLeft}px`;

        // Ждем пока дойдет (0.6 сек)
        setTimeout(() => {
          // 2. Прыжок
          player.classList.add('jump');

          // Ждем пока долетит до кубика (0.3 сек)
          setTimeout(() => {
            if (selectedLetter === correctLetter) {
              // ПРАВИЛЬНО: Кубик отскакивает
              blockElement.classList.add('bump');
              
              // Персонаж падает обратно на землю
              player.classList.remove('jump');

              setTimeout(() => {
                // Подставляем букву
                const wordEl = document.getElementById(`word-${taskIndex}`);
                wordEl.innerText = wordEl.innerText.replace('_', correctLetter);
                
                score++;
                scoreBoard.innerText = `⭐ ${score}`;

                // Едем дальше
                setTimeout(() => {
                  currentIndex++;
                  if (currentIndex >= data.tasks.length) {
                    document.getElementById('victory-screen').style.display = 'flex';
                  } else {
                    // Камера едет вперед, а персонаж идет обратно в начало кадра
                    world.style.left = `-${currentIndex * 1200}px`;
                    player.style.left = '200px'; 
                    setTimeout(() => { isAnimating = false; }, 1000);
                  }
                }, 500);
              }, 300); // Время приземления

            } else {
              // ОШИБКА: Кубик не двигается, персонаж падает
              player.classList.remove('jump');
              
              // Задержка на пике прыжка, потом падение в яму
              setTimeout(() => {
                player.classList.add('fall');
                
                setTimeout(() => {
                  // Сброс уровня после падения
                  score = 0;
                  currentIndex = 0;
                  scoreBoard.innerText = `⭐ 0`;
                  
                  world.style.left = '0px';
                  player.classList.remove('fall');
                  player.style.left = '200px';
                  
                  // Возвращаем подчеркивания
                  data.tasks.forEach((t, i) => {
                    document.getElementById(`word-${i}`).innerText = t.word;
                  });
                  document.querySelectorAll('.question-block').forEach(el => el.classList.remove('bump'));
                  
                  setTimeout(() => { isAnimating = false; }, 800);
                }, 1000); // Ждем пока упадет в лаву
              }, 100); 
            }
          }, 300); // Время полета вверх
        }, 600); // Время ходьбы до блока
      };
    }
  </script>
</body>
</html>
