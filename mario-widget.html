<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mario Spelling Game</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    #game-window { position: relative; width: 1200px; height: 700px; background-size: cover; background-position: bottom; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 100vw; aspect-ratio: 12 / 7; }

    #lava { position: absolute; bottom: 0; width: 100%; height: 60px; background: linear-gradient(to bottom, #ff4500, #8b0000); border-top: 5px solid #ffaa00; z-index: 35; }
    
    /* Земля статичная, на весь экран */
    .ground-segment { position: absolute; bottom: 60px; width: 100%; height: 100px; background: #6b4226; border-top: 15px solid #3cb371; z-index: 30; }

    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.8s; }
    #score-board { position: absolute; top: 20px; right: 30px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; font-size: 28px; font-weight: bold; border-radius: 10px; border: 2px solid gold; text-shadow: 2px 2px 0 #000; }

    /* Персонаж - переходы задаются динамически в JS для строгих прыжков */
    #player {
      position: absolute;
      width: 100px; height: 100px;
      bottom: 160px; /* Уровень земли */
      left: 550px;   /* Центр */
      z-index: 40;
      object-fit: contain;
    }

    /* Элементы уровня */
    .start-label { position: absolute; bottom: 180px; width: 100%; text-align: center; font-size: 28px; font-weight: 900; color: #ffcc00; text-shadow: 2px 2px 0 #000; letter-spacing: 4px; z-index: 15; opacity: 0.8; }
    .start-pad { position: absolute; bottom: 160px; left: 500px; width: 200px; height: 10px; background: #ffcc00; border: 3px solid #000; border-radius: 10px 10px 0 0; z-index: 15; }

    #word-display { position: absolute; top: 120px; width: 100%; text-align: center; font-size: 70px; color: white; font-weight: 900; text-shadow: 4px 4px 0 #000, 0 0 15px rgba(255,255,255,0.5); letter-spacing: 8px; z-index: 20;}
    
    /* Кубики статичны */
    .question-block {
      position: absolute;
      top: 300px;
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #ffc107, #d39e00);
      border: 4px solid #000;
      border-radius: 8px;
      display: flex; justify-content: center; align-items: center;
      font-size: 50px; color: white; font-weight: 900;
      cursor: pointer; pointer-events: auto;
      box-shadow: inset -5px -5px 0 rgba(0,0,0,0.3), inset 5px 5px 0 rgba(255,255,255,0.6), 5px 5px 15px rgba(0,0,0,0.6);
      text-shadow: 2px 2px 0 #000;
      transition: background 0.3s;
      z-index: 20;
    }
    .question-block::after { content: ''; position: absolute; inset: 4px; border: 2px dashed rgba(0,0,0,0.15); border-radius: 4px; pointer-events: none; }
    
    #left-block { left: 300px; }
    #right-block { left: 820px; }

    /* Экраны старта и победы */
    #start-screen { background: #000; z-index: 300; }
    
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
    .char-select { display: flex; gap: 30px; margin-top: 30px; }
    .char-option { width: 120px; height: 120px; object-fit: contain; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.1); border-radius: 15px; padding: 10px; border: 4px solid transparent; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
    .char-option:hover { transform: scale(1.1); border-color: #00bfff; background: rgba(0,191,255,0.2); }
    
    #victory-screen { background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
    #victory-screen h1 { font-size: 80px; color: gold; text-shadow: 0 0 30px rgba(255,215,0,0.8); margin: 0; }
    #victory-screen button { margin-top: 30px; padding: 15px 40px; font-size: 24px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 5px 0 #1e7e34; transition: 0.2s; }
    #victory-screen button:active { transform: translateY(5px); box-shadow: none; }
  </style>
</head>
<body>

  <div id="game-window">
    <div id="lava"></div>
    <div class="ground-segment"></div>
    
    <!-- Статичные элементы уровня -->
    <div class="start-label">СТАРТ</div>
    <div class="start-pad"></div>
    <div id="word-display"></div>
    <div id="left-block" class="question-block"></div>
    <div id="right-block" class="question-block"></div>
    
    <img id="player" src="" style="display: none;">
    
    <div id="ui-layer">
      <div id="score-board">⭐ 0</div>
    </div>

    <!-- Черный стартовый экран -->
    <div id="start-screen" class="overlay">
      <h1 style="color: #fff; text-shadow: 2px 2px 0 #000, 0 0 20px #00bfff;">Выбери героя</h1>
      <div class="char-select" id="char-container"></div>
    </div>

    <div id="victory-screen" class="overlay" style="display: none;">
      <h1>СУПЕР!</h1>
      <p style="font-size: 30px; color: #ccc;">Ты ответил на все слова!</p>
      <button onclick="location.reload()">Сыграть еще раз</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');
    if (!rawData) {
      document.body.innerHTML = "<h1 style='color:white;'>Нет данных игры</h1>";
    } else {
      const data = JSON.parse(decodeURIComponent(atob(rawData)));
      initGame(data);
    }

    function initGame(data) {
      document.getElementById('game-window').style.backgroundImage = `url(${data.bg})`;
      
      const player = document.getElementById('player');
      const scoreBoard = document.getElementById('score-board');
      const wordDisplay = document.getElementById('word-display');
      const leftBlock = document.getElementById('left-block');
      const rightBlock = document.getElementById('right-block');
      
      let currentIndex = 0;
      let score = 0;
      let isAnimating = false;
      let playerPos = 'start'; // Может быть 'start', 'left', 'right'

      // Выбор персонажа
      data.chars.forEach(imgUrl => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'char-option';
        img.onclick = () => {
          player.src = imgUrl;
          document.getElementById('start-screen').style.display = 'none';
          document.getElementById('ui-layer').style.opacity = '1';
          player.style.display = 'block';
          loadTask(0); // Загружаем первое слово
        };
        document.getElementById('char-container').appendChild(img);
      });

      // Функция загрузки уровня (обновляет текст, не трогая блоки)
      function loadTask(index) {
        const task = data.tasks[index];
        wordDisplay.innerText = task.word;

        const isCorrectLeft = Math.random() > 0.5;
        const leftLetter = isCorrectLeft ? task.correct : task.wrong;
        const rightLetter = isCorrectLeft ? task.wrong : task.correct;

        leftBlock.innerText = leftLetter;
        rightBlock.innerText = rightLetter;
        
        leftBlock.style.background = '';
        rightBlock.style.background = '';

        leftBlock.onclick = () => checkAnswer(index, leftLetter, task.correct, leftBlock, true);
        rightBlock.onclick = () => checkAnswer(index, rightLetter, task.correct, rightBlock, false);
      }

      // Логика строгих прыжков Г и П
      function jumpTo(isLeft, callback) {
        const targetLeft = isLeft ? 290 : 810; // Координаты X для кубиков
        
        if (playerPos === 'start') {
          // Прыжок с земли буквой "Г" (вверх, потом вбок)
          player.style.transition = 'bottom 0.3s ease-out';
          player.style.bottom = '400px';
          setTimeout(() => {
            player.style.transition = 'left 0.3s linear';
            player.style.left = `${targetLeft}px`;
            setTimeout(() => {
              playerPos = isLeft ? 'left' : 'right';
              callback();
            }, 300);
          }, 300);

        } else if ((playerPos === 'left' && isLeft) || (playerPos === 'right' && !isLeft)) {
          // Герой на левом кубике и кликнул на левый (прыжок на месте)
          player.style.transition = 'bottom 0.2s ease-out';
          player.style.bottom = '480px';
          setTimeout(() => {
            player.style.transition = 'bottom 0.2s ease-in';
            player.style.bottom = '400px';
            setTimeout(() => callback(), 200);
          }, 200);

        } else {
          // Прыжок с кубика на другой кубик буквой "П" (вверх -> вбок -> вниз)
          player.style.transition = 'bottom 0.2s ease-out';
          player.style.bottom = '500px';
          setTimeout(() => {
            player.style.transition = 'left 0.4s linear';
            player.style.left = `${targetLeft}px`;
            setTimeout(() => {
              player.style.transition = 'bottom 0.2s ease-in';
              player.style.bottom = '400px';
              setTimeout(() => {
                playerPos = isLeft ? 'left' : 'right';
                callback();
              }, 200);
            }, 400);
          }, 200);
        }
      }

      window.checkAnswer = function(taskIndex, selectedLetter, correctLetter, blockElement, isLeft) {
        if (isAnimating || taskIndex !== currentIndex) return;
        isAnimating = true;

        // Делаем прыжок до выбранного кубика
        jumpTo(isLeft, () => {
          if (selectedLetter === correctLetter) {
            // ПРАВИЛЬНО
            blockElement.style.background = '#28a745';
            wordDisplay.innerText = data.tasks[taskIndex].word.replace('_', correctLetter);
            score++;
            scoreBoard.innerText = `⭐ ${score}`;

            setTimeout(() => {
              currentIndex++;
              if (currentIndex >= data.tasks.length) {
                document.getElementById('victory-screen').style.display = 'flex';
              } else {
                // Загружаем следующее слово, герой остается на месте
                loadTask(currentIndex);
                isAnimating = false;
              }
            }, 800); // пауза, чтобы полюбоваться правильным ответом

          } else {
            // ОШИБКА
            blockElement.style.background = '#dc3545';
            
            setTimeout(() => {
              // 1. Падаем СТРОГО ВНИЗ на землю
              player.style.transition = 'bottom 0.3s ease-in';
              player.style.bottom = '160px';
              
              setTimeout(() => {
                // 2. Отходим СТРОГО В ЦЕНТР на старт
                player.style.transition = 'left 0.4s ease-in-out';
                player.style.left = '550px';
                
                setTimeout(() => {
                  // Полный сброс прогресса
                  playerPos = 'start';
                  currentIndex = 0;
                  score = 0;
                  scoreBoard.innerText = `⭐ 0`;
                  loadTask(0);
                  isAnimating = false;
                }, 400); // время ходьбы
              }, 300); // время падения
            }, 400); // время показа красного кубика
          }
        });
      };
    }
  </script>
</body>
</html>
