<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mario Spelling Game</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; }
    
    /* Контейнер строго 1200x700, с сохранением пропорций */
    #game-window {
      position: relative;
      width: 1200px;
      height: 700px;
      background-size: cover;
      background-position: bottom;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      max-width: 100vw;
      /* Адаптивный скейлинг для маленьких экранов */
      aspect-ratio: 12 / 7;
    }

    /* Лава (всегда на самом дне) */
    #lava { position: absolute; bottom: 0; width: 100%; height: 60px; background: linear-gradient(to bottom, #ff4500, #8b0000); z-index: 5; }
    
    /* Подвижный мир (земля и блоки) */
    #world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: left 1s ease-in-out; }
    
    /* Земля (состоит из блоков) */
    .ground-segment { position: absolute; bottom: 60px; width: 1200px; height: 100px; background: #6b4226; border-top: 15px solid #3cb371; z-index: 10; transition: transform 0.5s ease; }
    .ground-segment.fall { transform: translateY(300px); }

    /* Интерфейс */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    #score-board { position: absolute; top: 20px; right: 30px; background: rgba(0,0,0,0.7); color: gold; padding: 10px 20px; font-size: 28px; font-weight: bold; border-radius: 10px; border: 2px solid gold; text-shadow: 2px 2px 0 #000; }

    /* Персонаж */
    #player {
      position: absolute;
      width: 100px;
      height: 100px;
      bottom: 160px; /* Над землей */
      left: 200px;
      z-index: 20;
      object-fit: contain;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), bottom 0.5s ease-in;
    }
    #player.jump { transform: translateY(-150px); }
    #player.fall { bottom: -100px; transform: rotate(180deg); transition: bottom 0.8s ease-in, transform 0.8s; }

    /* Игровые элементы на уровне */
    .level-station { position: absolute; width: 1200px; height: 100%; top: 0; }
    
    .word-display { position: absolute; top: 150px; width: 100%; text-align: center; font-size: 60px; color: white; font-weight: bold; text-shadow: 4px 4px 0 #000; letter-spacing: 5px; }
    
    .blocks-container { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); display: flex; gap: 80px; }
    
    .question-block { width: 80px; height: 80px; background: #c84c0c; border: 4px solid #000; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 50px; color: white; font-weight: bold; cursor: pointer; pointer-events: auto; box-shadow: inset -5px -5px 0 rgba(0,0,0,0.3); transition: transform 0.1s; }
    .question-block:hover { transform: scale(1.1); }
    .question-block:active { transform: scale(0.9); }

    /* Оверлеи (Старт и Победа) */
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; }
    .char-select { display: flex; gap: 30px; margin-top: 30px; }
    .char-option { width: 120px; height: 120px; object-fit: contain; cursor: pointer; transition: 0.2s; background: #333; border-radius: 15px; padding: 10px; border: 4px solid transparent; }
    .char-option:hover { transform: scale(1.1); border-color: #ffaa00; }
    
    #victory-screen h1 { font-size: 80px; color: gold; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin: 0; }
    #victory-screen button { margin-top: 30px; padding: 15px 40px; font-size: 24px; background: #ff4500; color: white; border: none; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="game-window">
    <div id="lava"></div>
    <div id="world"></div>
    
    <img id="player" src="" style="display: none;">
    
    <div id="ui-layer">
      <div id="score-board" style="display: none;">⭐ 0</div>
    </div>

    <div id="start-screen" class="overlay">
      <h1 style="color: #ffaa00; text-shadow: 4px 4px 0 #000;">Выбери героя!</h1>
      <div class="char-select" id="char-container"></div>
    </div>

    <div id="victory-screen" class="overlay" style="display: none;">
      <h1>ПОБЕДА!</h1>
      <p style="font-size: 30px; color: #ccc;">Ты прошел все слова!</p>
      <button onclick="location.reload()">Играть снова</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');
    if (!rawData) {
      document.body.innerHTML = "<h1 style='color:white;'>Нет данных игры</h1>";
    } else {
      const data = JSON.parse(decodeURIComponent(atob(rawData)));
      initGame(data);
    }

    function initGame(data) {
      document.getElementById('game-window').style.backgroundImage = `url(${data.bg})`;
      
      const world = document.getElementById('world');
      const player = document.getElementById('player');
      const scoreBoard = document.getElementById('score-board');
      
      let currentIndex = 0;
      let score = 0;
      let isAnimating = false;

      // Генерируем выбор персонажей
      data.chars.forEach(imgUrl => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'char-option';
        img.onclick = () => {
          player.src = imgUrl;
          document.getElementById('start-screen').style.display = 'none';
          player.style.display = 'block';
          scoreBoard.style.display = 'block';
        };
        document.getElementById('char-container').appendChild(img);
      });

      // Генерируем бесконечный уровень
      data.tasks.forEach((task, index) => {
        // Отрезок земли
        const ground = document.createElement('div');
        ground.className = 'ground-segment';
        ground.style.left = `${index * 1200}px`;
        ground.id = `ground-${index}`;
        world.appendChild(ground);

        // Станция со словом и блоками
        const station = document.createElement('div');
        station.className = 'level-station';
        station.style.left = `${index * 1200}px`;
        
        // Рандомизируем положение правильной буквы (слева или справа)
        const isCorrectLeft = Math.random() > 0.5;
        const leftLetter = isCorrectLeft ? task.correct : task.wrong;
        const rightLetter = isCorrectLeft ? task.wrong : task.correct;

        station.innerHTML = `
          <div class="word-display" id="word-${index}">${task.word}</div>
          <div class="blocks-container">
            <div class="question-block" onclick="checkAnswer(${index}, '${leftLetter}', '${task.correct}', this)">${leftLetter}</div>
            <div class="question-block" onclick="checkAnswer(${index}, '${rightLetter}', '${task.correct}', this)">${rightLetter}</div>
          </div>
        `;
        world.appendChild(station);
      });

      // Функция проверки ответа (сделана глобальной для onclick)
      window.checkAnswer = function(taskIndex, selectedLetter, correctLetter, blockElement) {
        if (isAnimating || taskIndex !== currentIndex) return;
        isAnimating = true;

        if (selectedLetter === correctLetter) {
          // ПРАВИЛЬНО: Прыжок, подстановка буквы, движение дальше
          player.classList.add('jump');
          blockElement.style.background = '#28a745'; // зеленеет
          
          setTimeout(() => {
            player.classList.remove('jump');
            // Вставляем букву в слово
            const wordEl = document.getElementById(`word-${taskIndex}`);
            wordEl.innerText = wordEl.innerText.replace('_', correctLetter);
            
            score++;
            scoreBoard.innerText = `⭐ ${score}`;
            
            setTimeout(() => {
              currentIndex++;
              if (currentIndex >= data.tasks.length) {
                // Победа
                document.getElementById('victory-screen').style.display = 'flex';
              } else {
                // Двигаем мир
                world.style.left = `-${currentIndex * 1200}px`;
                isAnimating = false;
              }
            }, 500); // пауза перед скроллом
          }, 500); // длительность прыжка

        } else {
          // ОШИБКА: Провал земли и падение в лаву
          blockElement.style.background = '#dc3545'; // краснеет
          document.getElementById(`ground-${taskIndex}`).classList.add('fall');
          
          setTimeout(() => {
            player.classList.add('fall'); // падает вниз
            
            setTimeout(() => {
              // СБРОС ИГРЫ
              score = 0;
              currentIndex = 0;
              scoreBoard.innerText = `⭐ ${score}`;
              
              // Возвращаем UI в исходное
              world.style.left = '0px';
              player.classList.remove('fall');
              document.querySelectorAll('.ground-segment').forEach(el => el.classList.remove('fall'));
              document.querySelectorAll('.question-block').forEach(el => el.style.background = '#c84c0c');
              
              // Возвращаем слова с подчеркиваниями
              data.tasks.forEach((t, i) => {
                document.getElementById(`word-${i}`).innerText = t.word;
              });

              isAnimating = false;
            }, 1000); // ждем пока упадет
          }, 200); // задержка перед падением после провала земли
        }
      };
    }
  </script>
</body>
</html>
