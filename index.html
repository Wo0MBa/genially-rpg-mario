<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Генератор: Платформер с буквами</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #111; color: #eee; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #222; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.8); }
    h1 { color: #ff4500; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    h3 { border-bottom: 2px solid #444; padding-bottom: 5px; color: #ffaa00; }
    input[type="url"], input[type="text"], select { width: 100%; margin-bottom: 10px; padding: 12px; border-radius: 5px; border: 1px solid #555; background: #333; color: white; box-sizing: border-box; font-size: 16px; font-family: inherit; }
    button { background: #ff4500; color: white; padding: 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; transition: 0.2s; width: 100%; margin-top: 10px; font-size: 16px; }
    button:hover { background: #ff6347; }
    
    .task-card { background: #2a2a2a; border: 1px solid #444; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; position: relative; }
    .task-card input { margin-bottom: 0; }
    .task-num { font-size: 1.2rem; font-weight: bold; color: #ffaa00; min-width: 30px; }
    
    .delete-btn { width: 40px; height: 40px; margin: 0; padding: 0; background: #dc3545; color: white; border-radius: 5px; font-size: 18px; line-height: 40px; text-align: center; cursor: pointer; border: none; flex-shrink: 0; transition: 0.2s; }
    .delete-btn:hover { background: #c82333; transform: scale(1.05); }

    #add-task-btn { background: transparent; border: 2px dashed #ff4500; color: #ff4500; }
    #add-task-btn:hover { background: rgba(255, 69, 0, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Генератор Платформера</h1>
    
    <h3>1. Графика и настройки</h3>
    <input type="url" id="bg-url" placeholder="URL фона (например, лес или горы)">
    <input type="url" id="char1-url" placeholder="URL персонажа 1">
    <input type="url" id="char2-url" placeholder="URL персонажа 2">
    <input type="url" id="char3-url" placeholder="URL персонажа 3">
    
    <!-- Настройка размера персонажа -->
    <select id="char-scale">
      <option value="1">Размер персонажа: Стандартный (1x)</option>
      <option value="1.5">Размер персонажа: Увеличенный (1.5x)</option>
      <option value="2">Размер персонажа: Большой (2x)</option>
      <option value="2.5">Размер персонажа: Огромный (2.5x)</option>
      <option value="3">Размер персонажа: Гигантский (3x)</option>
    </select>

    <h3>2. Задания (Слова с пропусками)</h3>
    <p style="color: #aaa; font-size: 0.9em;">Используйте нижнее подчеркивание "_" для пропуска. Например: С_БАКА.</p>
    <div id="tasks-panel"></div>
    <button id="add-task-btn">+ Добавить слово</button>

    <h3>3. Экспорт для Genially (1200x700)</h3>
    <button id="generate-btn" style="background: #28a745;">Сгенерировать iframe-код</button>
    <textarea id="iframe-code" rows="4" readonly style="width: 100%; margin-top: 15px; padding: 10px; background: #111; color: #0f0; border: 1px solid #333;"></textarea>
  </div>

  <script>
    let taskCount = 0;
    const tasksPanel = document.getElementById('tasks-panel');

    function addTask() {
      taskCount++;
      const div = document.createElement('div');
      div.className = 'task-card';
      div.id = `task-${taskCount}`;
      div.innerHTML = `
        <div class="task-num">${taskCount}.</div>
        <input type="text" class="t-word" placeholder="Слово (напр: К_РОВА)" style="flex: 2;">
        <input type="text" class="t-correct" placeholder="Верная буква (О)" style="flex: 1; border-color: #28a745;">
        <input type="text" class="t-wrong" placeholder="Ошибка (А)" style="flex: 1; border-color: #dc3545;">
        <button class="delete-btn" onclick="this.parentElement.remove()" title="Удалить слово">✖</button>
      `;
      tasksPanel.appendChild(div);
      updateNumbers(); 
    }

    function updateNumbers() {
      const cards = document.querySelectorAll('.task-card');
      cards.forEach((card, index) => {
        card.querySelector('.task-num').innerText = `${index + 1}.`;
      });
    }

    addTask(); addTask(); addTask();
    
    tasksPanel.addEventListener('click', function(e) {
      if(e.target.classList.contains('delete-btn')) {
        setTimeout(updateNumbers, 10); 
      }
    });

    document.getElementById('add-task-btn').addEventListener('click', addTask);

    document.getElementById('generate-btn').addEventListener('click', () => {
      const data = {
        bg: document.getElementById('bg-url').value || 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1200', 
        chars: [
          document.getElementById('char1-url').value || 'https://cdn-icons-png.flaticon.com/128/104/104663.png',
          document.getElementById('char2-url').value,
          document.getElementById('char3-url').value
        ].filter(Boolean),
        charScale: document.getElementById('char-scale').value, // Сохраняем масштаб
        tasks: []
      };

      let valid = true;
      document.querySelectorAll('.task-card').forEach(card => {
        const word = card.querySelector('.t-word').value.trim();
        const correct = card.querySelector('.t-correct').value.trim().toUpperCase();
        const wrong = card.querySelector('.t-wrong').value.trim().toUpperCase();
        
        if(word || correct || wrong) {
          if(!word || !correct || !wrong) valid = false;
          data.tasks.push({ word, correct, wrong });
        }
      });

      if (!valid || data.tasks.length === 0) return alert('Заполните все поля в оставшихся заданиях или удалите пустые строки!');

      const json = JSON.stringify(data);
      const lzw = compress(json);
      const currentUrl = window.location.href.replace(/\/[^\/]*$/, '/');
      const widgetUrl = `${currentUrl}mario-widget.html?z=${encodeURIComponent(lzw)}`;
      
      const iframeStr = `<iframe src="${widgetUrl}" width="1200" height="700" frameborder="0" allowfullscreen style="max-width: 100%; border: none;"></iframe>`;
      document.getElementById('iframe-code').value = iframeStr;
      navigator.clipboard.writeText(iframeStr);
      
      const btn = document.getElementById('generate-btn');
      btn.innerText = '✅ Сжато и скопировано!';
      setTimeout(() => btn.innerText = 'Сгенерировать iframe-код', 2000);
    });

    // LZW Compression
    function compress(uncompressed) {
        let dictionary = {};
        for (let i = 0; i < 256; i++) dictionary[String.fromCharCode(i)] = i;
        let word = "", result = [], dictSize = 256;
        for (let i = 0; i < uncompressed.length; i++) {
            let c = uncompressed.charAt(i), wc = word + c;
            if (dictionary.hasOwnProperty(wc)) word = wc;
            else {
                result.push(dictionary[word]);
                dictionary[wc] = dictSize++;
                word = String(c);
            }
        }
        if (word !== "") result.push(dictionary[word]);
        return result.map(x => String.fromCharCode(x)).join("");
    }
  </script>
</body>
</html>
